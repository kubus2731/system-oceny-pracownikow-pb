version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: soopu_postgres
    environment:
      POSTGRES_DB: soopu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: haslo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: